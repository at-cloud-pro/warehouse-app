security:
  providers:
    account_manager:
      id: App\Auth\Infrastructure\AccountManager\Provider\AccountManagerUserProvider
  firewalls:
    dev:
      pattern: ^/(_(profiler|wdt)|css|images|js)/
      security: false
    main:
      lazy: true
      provider: account_manager
      form_login:
        login_path: app.redirect-to-auth
      logout:
        path: /auth/sign-out
        target: /out
  access_control:
    - { path: ^/auth/redirect, roles: PUBLIC_ACCESS }
    - { path: ^/auth/catch, roles: PUBLIC_ACCESS }
    - { path: ^/, roles: ROLE_USER }
